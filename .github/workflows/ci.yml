name: Check
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build

  package:
    needs: check
    if: github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: darwin-arm64, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build:release ${{ matrix.target }}
      - run: bun scripts/smoke-release.ts
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: discordex-${{ matrix.target }}
          path: |
            dist/releases/discordex-${{ matrix.target }}
            dist/releases/discordex-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          overwrite: true

  release:
    needs: package
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: discordex-*
          path: assets
          merge-multiple: true
      - name: Publish verified packages
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          binaries=(discordex-{linux,darwin}-{x64,arm64})
          files=("${binaries[@]}" "${binaries[@]/%/.tar.gz}")
          sha256sum "${files[@]}" > SHA256SUMS
          tag="build-${GITHUB_SHA:0:12}"
          # Re-running a push may find a complete release or a draft left during upload.
          if gh release view "$tag" --json isDraft > release.json; then
            if jq -e '.isDraft == false' release.json >/dev/null; then exit 0; fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft \
              --title "Discordex ${GITHUB_SHA:0:12}" \
              --notes "Download the executable for your OS and CPU, save it as discordex, and run chmod +x discordex. Then run ./discordex doctor from your configured directory. The .tar.gz downloads also include example configuration and documentation."
          fi
          gh release upload "$tag" "${files[@]}" SHA256SUMS --clobber
          latest=false
          if [[ "$(gh api "repos/$GH_REPO/commits/$DEFAULT_BRANCH" --jq .sha)" == "$GITHUB_SHA" ]]; then latest=true; fi
          gh release edit "$tag" --draft=false --latest="$latest"
